name: iPhoneからの操作

on:
  repository_dispatch:
    types: [keep, cancel, reserve, status, test]
  workflow_dispatch:
    inputs:
      task:
        description: keep / cancel / reserve / status / test
        default: test
      number:
        description: 予約番号（keep / cancel）
        required: false
      date:
        description: 日付 YYYY-MM-DD（reserve）
        required: false
      start:
        description: 開始 HH:MM（reserve）
        required: false
      end:
        description: 返却 HH:MM（reserve）
        required: false

concurrency:
  group: timescar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 実行
        env:
          TIMES_ID: ${{ secrets.TIMES_ID }}
          TIMES_PW: ${{ secrets.TIMES_PW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TASK: ${{ github.event.action || inputs.task }}
          NUMBER: ${{ github.event.client_payload.number || inputs.number }}
          RDATE: ${{ github.event.client_payload.date || inputs.date }}
          RSTART: ${{ github.event.client_payload.start || inputs.start }}
          REND: ${{ github.event.client_payload.end || inputs.end }}
        run: |
          case "$TASK" in
            keep|cancel) python src/main.py "$TASK" "$NUMBER" ;;
            reserve)     python src/main.py reserve --date "$RDATE" --start "$RSTART" --end "$REND" ;;
            status|test) python src/main.py "$TASK" ;;
            *) echo "unknown task: $TASK"; exit 1 ;;
          esac
      - uses: ./.github/actions/save-state
        if: always()
