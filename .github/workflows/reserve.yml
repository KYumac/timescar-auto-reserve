name: 0時に2週間先の土日を予約

on:
  schedule:
    - cron: "45 14 * * *"   # 23:45 JST に起動し、0:00まで待機して予約
    - cron: "25 15 * * *"   # 0:25 JST 予備（本番が遅延・失敗したとき用。予約済みなら何もしない）
  workflow_dispatch:

concurrency:
  group: timescar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 予約
        env:
          TIMES_ID: ${{ secrets.TIMES_ID }}
          TIMES_PW: ${{ secrets.TIMES_PW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python src/main.py reserve --wait-open
      - uses: ./.github/actions/save-state
        if: always()
