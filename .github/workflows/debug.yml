name: debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              pg = b.new_page(locale="ja-JP")
              pg.goto("https://share.timescar.jp/view/member/mypage.jsp", wait_until="networkidle")
              print("URL", pg.url)
              for f in pg.frames: print("FRAME", f.url)
              print(pg.evaluate("""() => JSON.stringify([...document.querySelectorAll('input,button,a[onclick]')].map(e=>({t:e.tagName,type:e.type,name:e.name,id:e.id,ml:e.maxLength,vis:!!e.offsetParent,alt:e.alt,val:e.type==='password'?'':(e.value||'').slice(0,20),oc:(e.getAttribute('onclick')||'').slice(0,60)})))"""))
              print(pg.evaluate("() => [...document.forms].map(f=>f.id+' '+f.action).join('\\n')"))
              b.close()
          PY
