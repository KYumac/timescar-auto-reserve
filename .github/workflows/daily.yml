name: 前日の確認通知と当日朝の自動キャンセル

on:
  schedule:
    - cron: "47 11 * * 5,6"   # 金・土 20:47 JST：明日使うか確認（ボタン付き通知）
    - cron: "5 23 * * 5,6"    # 土・日 8:05 JST：自動キャンセル
    - cron: "25 23 * * 5,6"   # 土・日 8:25 JST：予備
    - cron: "45 23 * * 5,6"   # 土・日 8:45 JST：予備
  workflow_dispatch:
    inputs:
      task:
        description: remind / auto-cancel
        default: remind

concurrency:
  group: timescar-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 実行
        env:
          TIMES_ID: ${{ secrets.TIMES_ID }}
          TIMES_PW: ${{ secrets.TIMES_PW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${{ inputs.task }}"
          elif [ "${{ github.event.schedule }}" = "47 11 * * 5,6" ]; then
            TASK=remind
          else
            TASK=auto-cancel
          fi
          python src/main.py "$TASK"
      - uses: ./.github/actions/save-state
        if: always()
