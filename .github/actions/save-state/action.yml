name: save-state
description: state.json の変更をコミットして保存
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if git diff --quiet -- state.json; then exit 0; fi
        git config user.name "timescar-bot"
        git config user.email "timescar-bot@users.noreply.github.com"
        git add state.json
        git commit -m "state: $(date -u +%FT%TZ)"
        for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 3; done
        exit 1
