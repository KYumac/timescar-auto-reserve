<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タイムズ予約">
<meta name="theme-color" content="#111">
<title>タイムズ予約</title>
<style>
  :root{--bg:#f4f4f2;--card:#fff;--ink:#1a1a1a;--sub:#6b6b6b;--line:#e2e2de;--accent:#e60012;--ok:#1f7a3a}
  @media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1d;--ink:#f2f2f2;--sub:#a0a0a0;--line:#2e2e2e}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 16px 40px}
  h1{font-size:22px;margin:20px 0 4px}
  .lead{color:var(--sub);font-size:13px;margin:0 0 16px}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
  h2{font-size:15px;margin:0 0 10px}
  .res{border-top:1px solid var(--line);padding:12px 0}
  .res:first-of-type{border-top:0;padding-top:0}
  .when{font-weight:700;font-size:17px}
  .where{color:var(--sub);font-size:14px}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-top:4px}
  .tag.keep{color:var(--ok);border-color:var(--ok)}
  .tag.auto{color:var(--accent);border-color:var(--accent)}
  .row{display:flex;gap:8px;margin-top:10px}
  button{flex:1;font:inherit;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button.danger{color:var(--accent);border-color:var(--accent)}
  button:disabled{opacity:.4}
  label{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px}
  input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .two{display:flex;gap:8px}.two>div{flex:1}
  #msg{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;font-size:14px}
  .empty{color:var(--sub);font-size:14px}
  details summary{color:var(--sub);font-size:13px}
</style>
</head>
<body>
<h1>タイムズ予約</h1>
<p class="lead">土日は0時に自動で予約。使わない日は当日朝に自動キャンセル。</p>

<section id="setup" style="display:none">
  <h2>初回設定</h2>
  <p class="empty">ntfyに届いた「接続テスト成功」の通知をタップして、このページを開き直してください。</p>
</section>

<section>
  <h2>予約中</h2>
  <div id="list"><p class="empty">読み込み中…</p></div>
  <div class="row"><button onclick="send('status')">サイトと照合して通知</button></div>
</section>

<section>
  <h2>個別に予約する</h2>
  <label>日付</label><input id="d" type="date">
  <div class="two">
    <div><label>開始</label><input id="s" type="time" value="09:00" step="900"></div>
    <div><label>返却</label><input id="e" type="time" value="21:00" step="900"></div>
  </div>
  <div class="row"><button class="primary" onclick="reserve()">優先順に空きを探して予約</button></div>
</section>

<section>
  <h2>ログイン</h2>
  <p class="empty">PCにログイン画面を開きます。1分ほど待ってからリモートデスクトップで「ログイン」を押してください。</p>
  <div class="row"><button class="primary" onclick="send('login')">PCにログイン画面を開く</button></div>
  <div class="row"><button onclick="location.href='https://remotedesktop.google.com/access'">リモートデスクトップを開く</button></div>
</section>

<details><summary>設定</summary>
  <div class="row"><button onclick="send('test')">接続テスト</button></div>
</details>

<div id="msg"></div>

<script>
const REPO = "KYumac/timescar-auto-reserve";
const WD = "日月火水木金土";
let topic = null;
const m = location.hash.match(/t=([\w-]+)/);
try {
  if (m) { localStorage.setItem("cmd_topic", m[1]); history.replaceState(null, "", location.pathname); }
  topic = localStorage.getItem("cmd_topic");
} catch (e) { topic = m ? m[1] : null; }

function toast(t){const el=document.getElementById("msg");el.textContent=t;el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",4000)}

async function send(cmd){
  if(!topic){document.getElementById("setup").style.display="block";return}
  try{
    const r = await fetch("https://ntfy.sh/"+topic,{method:"POST",body:cmd});
    toast(r.ok ? "受け付けました。1〜2分で処理して通知します（PCが起動している必要があります）" : "失敗しました（"+r.status+"）");
  }catch(e){toast("送信できませんでした")}
}

function day(iso){const d=new Date(iso+"T00:00:00+09:00");return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）"}

async function load(){
  if(!topic) document.getElementById("setup").style.display="block";
  const el = document.getElementById("list");
  let st;
  try{
    const stateTopic = topic.replace(/-cmd$/, "-state");
    const r = await fetch("https://ntfy.sh/"+stateTopic+"/json?poll=1&since=all");
    if(!r.ok) throw new Error(r.status);
    const lines = (await r.text()).trim().split("\n").filter(Boolean).map(l=>JSON.parse(l)).filter(m=>m.event==="message");
    st = lines.length ? JSON.parse(lines[lines.length-1].message) : {reservations:{}};
  }catch(e){el.innerHTML='<p class="empty">読み込めませんでした</p>';return}
  const items = Object.entries(st.reservations||{}).sort((a,b)=>(a[1].date+a[1].start).localeCompare(b[1].date+b[1].start));
  if(!items.length){el.innerHTML='<p class="empty">予約はありません</p>';return}
  el.innerHTML = items.map(([n,x])=>`
    <div class="res">
      <div class="when">${day(x.date)} ${x.start}〜${x.end}</div>
      <div class="where">${x.station}・${x.car||""}</div>
      ${x.keep?'<span class="tag keep">使う</span>':(x.auto?'<span class="tag auto">当日朝に自動キャンセル</span>':'')}
      <div class="row">
        ${x.keep?'':`<button class="primary" onclick="send('keep ${n}')">使う</button>`}
        <button class="danger" onclick="if(confirm('この予約を取り消しますか？'))send('cancel ${n}')">キャンセル</button>
      </div>
    </div>`).join("");
}

function reserve(){
  const d=document.getElementById("d").value,s=document.getElementById("s").value,e=document.getElementById("e").value;
  if(!d||!s||!e){toast("日付と時間を入れてください");return}
  send("reserve "+d+" "+s+" "+e);
}

(function(){const t=new Date(Date.now()+864e5);document.getElementById("d").value=t.toISOString().slice(0,10)})();
load();
</script>
</body>
</html>
